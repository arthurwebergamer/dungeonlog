name: Android APK (teste)
on:
  push:
    branches: [capacitor]
    paths: ['app-android/**', 'play/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: app-android/android
      - uses: actions/upload-artifact@v4
        with:
          name: dungeonlog-teste-apk
          path: app-android/android/app/build/outputs/apk/release/app-release.apk
      - name: Publicar APK numa pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          cp app-android/android/app/build/outputs/apk/release/app-release.apk dungeonlog-teste.apk
          gh release delete apk-teste --cleanup-tag --yes || true
          gh release create apk-teste dungeonlog-teste.apk --prerelease --target "$GITHUB_SHA" --title "APK de teste (Capacitor)" --notes "Build ${GITHUB_SHA::7} - so pra teste"
