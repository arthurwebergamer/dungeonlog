name: Android APK (teste)
on:
  push:
    branches: [capacitor]
    paths: ['app-android/**', 'play/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && ./gradlew assembleDebug
        working-directory: app-android/android
      - uses: actions/upload-artifact@v4
        with:
          name: dungeonlog-teste-apk
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
