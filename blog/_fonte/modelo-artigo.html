<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITULO}} | Dungeonlog</title>
<meta name="description" content="{{DESCRICAO}}">
<link rel="canonical" href="{{URL}}">
<meta name="theme-color" content="#282828">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Dungeonlog">
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="{{DESCRICAO}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{OGIMGURL}}">
<meta property="og:locale" content="{{OGLOCALE}}">
<meta property="article:published_time" content="{{DATA}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{OGIMGURL}}">
<link rel="icon" href="/play/icon-192.png">
<link rel="apple-touch-icon" href="/play/icon-192.png">
<link rel="stylesheet" href="/fonts/fonts2.css">
<link rel="stylesheet" href="/legal.css?v=5">
<script type="application/ld+json">{{JSONLD}}</script>
<style>
.corpo img{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);touch-action:pan-y}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:6px;cursor:default;user-select:none}
.lb button{position:absolute;border:0;background:rgba(40,40,40,.85);color:#fff;font:inherit;font-size:1.6rem;line-height:1;width:48px;height:48px;border-radius:50%;cursor:pointer}
.lb button:hover{background:#555}
.lb .lb-x{top:14px;right:14px}
.lb .lb-p{left:12px;top:50%;transform:translateY(-50%)}
.lb .lb-n{right:12px;top:50%;transform:translateY(-50%)}
.lb .lb-c{position:absolute;top:22px;left:50%;transform:translateX(-50%);color:#ddd;font-size:.95rem}
.lb.um .lb-p,.lb.um .lb-n,.lb.um .lb-c{display:none}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="{{HOMEURL}}">
    <img src="/play/icon-192.png" alt="">
    <span>Dungeonlog</span>
  </a>
  <div class="lang"><a href="{{BLOGURL}}" class="active">Blog</a></div>
</header>

<main class="wrap">
  <p class="updated"><a href="{{HOMEURL}}">{{HOME}}</a> · <a href="{{BLOGURL}}">Blog</a></p>
  <h1>{{TITULO}}</h1>
  <p class="updated"><time datetime="{{DATA}}">{{DATA_BR}}</time></p>
{{CAPA}}

<div class="corpo">
{{CONTEUDO}}
</div>

  <h2>Dungeonlog</h2>
  <p><a href="{{HOMEURL}}">{{T_KNOW}}</a> · <a href="https://play.google.com/store/apps/details?id=com.dungeonlog" rel="noopener">{{T_PLAY}}</a></p>
</main>

<footer class="site">
  <div class="wrap">
    <div class="footcols">
      <div class="footcol">
        <span class="footlabel">{{T_NAV}}</span>
        <a href="{{HOMEURL}}">{{HOME}}</a>
        <a href="{{BLOGURL}}">Blog</a>
      </div>
      <div class="footcol">
        <span class="footlabel">{{T_LEGAL}}</span>
        <a href="{{PRIVACY}}">{{T_PRIVACY}}</a>
        <a href="{{TERMS}}">{{T_TERMS}}</a>
        <a href="{{DELETE}}">{{T_DELETE}}</a>
      </div>
      <div class="footcol">
        <span class="footlabel">{{T_CONTACT}}</span>
        <a href="mailto:arthurdungeonlog@gmail.com">{{T_EMAIL}}</a>
      </div>
    </div>
    <span class="copy">{{T_COPY}}</span>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="{{T_VIEWER}}">
  <button type="button" class="lb-x" aria-label="{{T_CLOSE}}">&times;</button>
  <button type="button" class="lb-p" aria-label="{{T_PREV}}">&#8249;</button>
  <img alt="">
  <button type="button" class="lb-n" aria-label="{{T_NEXT}}">&#8250;</button>
  <span class="lb-c" aria-live="polite"></span>
</div>
<script>
(function(){
  var imgs=[].slice.call(document.querySelectorAll('.corpo img'));
  var lb=document.getElementById('lb');
  if(!imgs.length||!lb) return;
  var big=lb.querySelector('img'), cnt=lb.querySelector('.lb-c'), i=0, x0=null;
  if(imgs.length<2) lb.className+=' um';
  function show(n){
    i=(n+imgs.length)%imgs.length;
    big.src=imgs[i].currentSrc||imgs[i].src; big.alt=imgs[i].alt;
    cnt.textContent=(i+1)+' / '+imgs.length;
  }
  function open(n){ show(n); lb.classList.add('on'); document.body.style.overflow='hidden'; lb.querySelector('.lb-x').focus(); }
  function close(){ lb.classList.remove('on'); document.body.style.overflow=''; big.removeAttribute('src'); }
  imgs.forEach(function(im,n){ im.addEventListener('click',function(){ open(n); }); });
  lb.querySelector('.lb-x').addEventListener('click',close);
  lb.querySelector('.lb-p').addEventListener('click',function(e){ e.stopPropagation(); show(i-1); });
  lb.querySelector('.lb-n').addEventListener('click',function(e){ e.stopPropagation(); show(i+1); });
  lb.addEventListener('click',function(e){ if(e.target!==big && !e.target.closest('button')) close(); });
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on')) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft') show(i-1);
    else if(e.key==='ArrowRight') show(i+1);
  });
  lb.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  lb.addEventListener('touchend',function(e){
    if(x0===null) return; var d=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(d)>50) show(d<0?i+1:i-1);
  });
})();
</script>

</body>
</html>
