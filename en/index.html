<!DOCTYPE html>
<!-- English sibling of the root landing page (/). Same HTML/CSS, content
     translated -- see the Portuguese version's header comment for the
     full history of design decisions (background, contrast, etc.), which
     apply identically here. Kept as a separate static page (not a JS
     language switch) so each language has its own indexable/linkable
     URL and there's no data-i18n attribute duplication to maintain. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DungeonLog</title>
<meta name="description" content="DungeonLog — your to-do list becomes a dungeon.">
<link rel="icon" href="/play/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  html,body{ min-height:100%; }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- Background: same treatment as the real .arena ---------- */
  .dungeonBg{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.4) 100%),
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAKCAYAAADVTVykAAABfElEQVR4nJ2TwU7CQBCGvxKMQeCEXojGlMvWIw/AnfIOwh0egYfwpIneQJ4Bn4L22r10SeCoJ0CDJVkvdNPWgsT/srM738x0Z6fWZDKpPwyHdLpdlFK0222yklIyHY3o9HoHmVMUBAFvr6+49/copXBdl6KUkkW0JgxDGo0GUspfgUIInnefKKWwbTuXOUWO4/ASbZjP56ZWAeD6rILrugcD/1vwUJ5kBwsAH6sVUkqEEMbheR6e5xm7tNXYtp3LJLnkmrUBSludqmXd1mp1nQCuKpVUgN5/YJ5q1SrW3l5EGwBuzsosok1qjfW+XgPwdW6Z82K33wdg9PREr9//c8iklIwfH+kOBoRhePTpYn46HnPXagH8yl2Mjcty+eggxhJCUKtWT2Jjfrq38wa4kNz8dZv4RstofRIb84toc7CrpgPL3WcuoLVO7X3fB20Zn2VZeWHpHEd8pgPZ6QSYzWamqO/7ADSbTUrfmiAIcBzHsNm/ITn9F5ncSd8PSsnXJX9WpAwAAAAASUVORK5CYII=") repeat,
      linear-gradient(180deg, #454545 0%, #383838 55%, #2C2C2C 100%);
    background-size:auto, 130px 41px, auto;
    image-rendering:pixelated;
  }

  /* ---------- Header ---------- */
  header.site{
    position:relative; z-index:1;
    max-width:none;
    padding:22px 28px;
  }

  .dim{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(58% 42% at 50% 50%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 55%, rgba(0,0,0,0) 85%);
  }

  /* ---------- Hero ---------- */
  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:24px 28px 64px;
  }
  h1{
    font-family:'Outfit', sans-serif;
    font-weight:600;
    letter-spacing:-.01em;
    line-height:1.3;
    font-size:clamp(1.4rem, 4vw, 2.1rem);
    max-width:480px;
    color:#fff;
  }
  .soon{
    display:block;
    margin-top:16px;
    font-family:'Outfit', sans-serif;
    font-weight:300;
    font-size:.8rem;
    letter-spacing:.01em;
    color:var(--muted);
  }

  /* ---------- Footer ---------- */
  footer.site{
    position:relative; z-index:1;
    border-top:none; background:transparent;
    padding:0 24px 28px;
    flex-shrink:0;
  }
  footer.site .wrap{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

</style>
</head>
<body>

  <div class="dungeonBg" aria-hidden="true"></div>
  <div class="dim" aria-hidden="true"></div>

  <header class="site">
    <a class="brand" href="/en/">
      <img src="/play/icon-192.png" alt="">
      <span>DungeonLog</span>
    </a>
    <div class="lang">
      <a href="/">PT</a>
      <span class="sep">·</span>
      <a href="/en/" class="active">EN</a>
    </div>
  </header>

  <main>
    <h1>Your to-do list<br>becomes a dungeon.</h1>
    <span class="soon">Coming soon to Google Play</span>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="mailto:arthurdungeonlog@gmail.com">Contact</a>
      <span class="dot">·</span>
      <a href="/en/privacy">Privacy</a>
      <span class="dot">·</span>
      <a href="/en/terms">Terms</a>
    </div>
  </footer>

</body>
</html>
