<!DOCTYPE html>
<!-- Landing page raiz do domínio dungeonlog.weberlabs.com.br.
     Substitui a antiga waitlist/ (removida). Fundo = mesma fórmula que a
     .arena de combate real usa (play/style.css ~linha 1006): tile
     TEMA_ARENA_TILE_B64 + gradiente vertical com as cores do tema
     Grafite (--arena-1/2/3) + vinheta radial. Estático, sem animação --
     a versão com blocos acendendo no hover/toque foi tentada e removida
     a pedido do usuário (queria algo mais clean).

     Ajustes desta versão:
     - Removida a grade interativa (JS) por completo.
     - Ícone do header sem image-rendering:pixelated -- o ícone real
       (play/icon-192.png) é arte "lisa" (sombreada), não pixel art; o
       pixelated forçava reamostragem nearest-neighbor ao encolher pra
       26px e ficava serrilhado/ruim. Sem essa propriedade o navegador
       reamostra suave, que é o certo pra esse arquivo.
     - Removido body{overflow:hidden}: no celular ele podia cortar o
       rodapé (Privacidade/Termos) fora da tela sem permitir rolar até
       ele. Agora a página rola normalmente se o conteúdo não couber.
     - Texto do hero encurtado (1 frase em vez de 2).
     - Título ganhou uma barrinha (underline) fina e curta embaixo,
       centralizada -- único elemento de "estilo" novo, mantendo clean.

     Ajuste seguinte (contraste): texto direto sobre o tijolo ficava
     quase ilegível em trechos mais claros da parede. 1ª tentativa foi um
     painel de vidro (glassmorphism) atrás de TUDO -- usuário achou que
     ficou "um quadradão". 2ª tentativa (esta): sem nenhum retângulo
     grande -- o destaque agora é um "highlight" que abraça só o texto
     mesmo (box-decoration-break:clone, uma pastilha escura por LINHA,
     não um bloco cobrindo o espaço vazio ao redor). Texto também bem
     mais curto: só a headline + "Em breve", sem parágrafo explicativo. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DungeonLog</title>
<meta name="description" content="DungeonLog — sua lista de tarefas vira uma masmorra.">
<link rel="icon" href="/play/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  html,body{ min-height:100%; }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- Fundo: mesmo tratamento da .arena real do app ---------- */
  .dungeonBg{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.4) 100%),
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAKCAYAAADVTVykAAABfElEQVR4nJ2TwU7CQBCGvxKMQeCEXojGlMvWIw/AnfIOwh0egYfwpIneQJ4Bn4L22r10SeCoJ0CDJVkvdNPWgsT/srM738x0Z6fWZDKpPwyHdLpdlFK0222yklIyHY3o9HoHmVMUBAFvr6+49/copXBdl6KUkkW0JgxDGo0GUspfgUIInnefKKWwbTuXOUWO4/ASbZjP56ZWAeD6rILrugcD/1vwUJ5kBwsAH6sVUkqEEMbheR6e5xm7tNXYtp3LJLnkmrUBSludqmXd1mp1nQCuKpVUgN5/YJ5q1SrW3l5EGwBuzsosok1qjfW+XgPwdW6Z82K33wdg9PREr9//c8iklIwfH+kOBoRhePTpYn46HnPXagH8yl2Mjcty+eggxhJCUKtWT2Jjfrq38wa4kNz8dZv4RstofRIb84toc7CrpgPL3WcuoLVO7X3fB20Zn2VZeWHpHEd8pgPZ6QSYzWamqO/7ADSbTUrfmiAIcBzHsNm/ITn9F5ncSd8PSsnXJX9WpAwAAAAASUVORK5CYII=") repeat,
      linear-gradient(180deg, #454545 0%, #383838 55%, #2C2C2C 100%);
    background-size:auto, 130px 41px, auto;
    image-rendering:pixelated;
  }

  /* ---------- Header ---------- */
  header.site{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:10px;
    padding:24px 28px;
  }
  header.site img{ width:26px; height:26px; border-radius:6px; }
  header.site span{ font-family:'Outfit',sans-serif; font-weight:600; letter-spacing:-.01em; font-size:.95rem; color:var(--text); }

  /* ---------- Hero ---------- */
  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:24px 28px 64px;
  }
  h1{
    font-family:'Outfit', sans-serif;
    font-weight:800;
    letter-spacing:-.02em;
    font-size:clamp(1.25rem, 3.6vw, 1.9rem);
    max-width:480px;
  }
  h1 .hl{
    background:rgba(10,9,8,.68);
    color:var(--text);
    padding:.28em .5em;
    border-radius:7px;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
    line-height:1.8;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .soon{
    display:block;
    margin-top:18px;
    font-family:'Outfit', sans-serif;
    font-size:.74rem;
    letter-spacing:.02em;
    color:var(--muted);
    text-shadow:0 2px 6px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.9);
  }

  /* ---------- Footer ---------- */
  footer.site{
    position:relative; z-index:1;
    border-top:none; background:transparent;
    padding:0 24px 28px;
    flex-shrink:0;
  }
  footer.site .wrap{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

</style>
</head>
<body>

  <div class="dungeonBg" aria-hidden="true"></div>

  <header class="site">
    <img src="/play/icon-192.png" alt="">
    <span>DungeonLog</span>
  </header>

  <main>
    <h1><span class="hl">Sua lista de tarefas<br>vira uma masmorra.</span></h1>
    <span class="soon">Em breve na Google Play</span>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="mailto:arthurdungeonlog@gmail.com">Contato</a>
      <span class="dot">·</span>
      <a href="/privacy">Privacidade</a>
      <span class="dot">·</span>
      <a href="/terms">Termos</a>
    </div>
  </footer>

</body>
</html>
