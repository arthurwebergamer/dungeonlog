<!DOCTYPE html>
<!-- Landing page raiz do domínio dungeonlog.weberlabs.com.br.
     Substitui a antiga waitlist/ (removida). Fundo = mesma fórmula que a
     .arena de combate real usa (play/style.css ~linha 1006): tile
     TEMA_ARENA_TILE_B64 + gradiente vertical com as cores do tema
     Grafite (--arena-1/2/3) + vinheta radial. Estático, sem animação --
     a versão com blocos acendendo no hover/toque foi tentada e removida
     a pedido do usuário (queria algo mais clean).

     Ajustes desta versão:
     - Removida a grade interativa (JS) por completo.
     - Ícone do header sem image-rendering:pixelated -- o ícone real
       (play/icon-192.png) é arte "lisa" (sombreada), não pixel art; o
       pixelated forçava reamostragem nearest-neighbor ao encolher pra
       26px e ficava serrilhado/ruim. Sem essa propriedade o navegador
       reamostra suave, que é o certo pra esse arquivo.
     - Removido body{overflow:hidden}: no celular ele podia cortar o
       rodapé (Privacidade/Termos) fora da tela sem permitir rolar até
       ele. Agora a página rola normalmente se o conteúdo não couber.
     - Texto do hero encurtado (1 frase em vez de 2).
     - Título ganhou uma barrinha (underline) fina e curta embaixo,
       centralizada -- único elemento de "estilo" novo, mantendo clean.

     Ajuste de contraste (4 tentativas):
     1) painel de vidro atrás de tudo -- "parece um quadradão".
     2) pastilha escura por linha -- ainda "horrível".
     3) contorno preto na letra (estilo legenda/HUD) -- usuário rejeitou:
        quer "estilo Apple", sem esse contorno, "pra ser simples".
     4ª tentativa (esta): nada NO texto (sem contorno, sem peso extra-
     bold) -- o contraste vem de escurecer a PRÓPRIA foto de fundo numa
     faixa ampla e suave atrás do texto (gradiente radial largo, sem
     borda perceptível), exatamente como a Apple escurece a foto/vídeo
     de fundo atrás do título nas páginas de produto, em vez de mexer no
     texto. Tipografia: peso 600 (semibold, não 800), sem text-shadow.

     PT/EN: esta é a versão em português (raiz, "/"). A versão em inglês
     é uma cópia irmã em /en/ (mesmo HTML, textos traduzidos) -- ver
     comentário equivalente lá. O seletor de idioma no header linka uma
     pra outra; não é troca dinâmica via JS, são páginas estáticas
     separadas (mais simples, sem duplicar conteúdo em atributos
     data-i18n, e cada idioma fica indexável/linkável na sua própria
     URL). /privacy e /terms seguem o mesmo padrão (raiz = PT, /en/... =
     EN), e ambos ganharam esse mesmo header com link de volta pra home
     (pedido do usuário: "deveria ter um jeito de voltar dos documentos
     pra essa tela principal"). -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DungeonLog</title>
<meta name="description" content="DungeonLog — sua lista de tarefas vira uma masmorra.">
<link rel="icon" href="/play/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  html,body{ min-height:100%; }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- Fundo: mesmo tratamento da .arena real do app ---------- */
  .dungeonBg{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.4) 100%),
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAKCAYAAADVTVykAAABfElEQVR4nJ2TwU7CQBCGvxKMQeCEXojGlMvWIw/AnfIOwh0egYfwpIneQJ4Bn4L22r10SeCoJ0CDJVkvdNPWgsT/srM738x0Z6fWZDKpPwyHdLpdlFK0222yklIyHY3o9HoHmVMUBAFvr6+49/copXBdl6KUkkW0JgxDGo0GUspfgUIInnefKKWwbTuXOUWO4/ASbZjP56ZWAeD6rILrugcD/1vwUJ5kBwsAH6sVUkqEEMbheR6e5xm7tNXYtp3LJLnkmrUBSludqmXd1mp1nQCuKpVUgN5/YJ5q1SrW3l5EGwBuzsosok1qjfW+XgPwdW6Z82K33wdg9PREr9//c8iklIwfH+kOBoRhePTpYn46HnPXagH8yl2Mjcty+eggxhJCUKtWT2Jjfrq38wa4kNz8dZv4RstofRIb84toc7CrpgPL3WcuoLVO7X3fB20Zn2VZeWHpHEd8pgPZ6QSYzWamqO/7ADSbTUrfmiAIcBzHsNm/ITn9F5ncSd8PSsnXJX9WpAwAAAAASUVORK5CYII=") repeat,
      linear-gradient(180deg, #454545 0%, #383838 55%, #2C2C2C 100%);
    background-size:auto, 130px 41px, auto;
    image-rendering:pixelated;
  }

  /* ---------- Header ---------- */
  header.site{
    position:relative; z-index:1;
    max-width:none;
    padding:22px 28px;
  }

  /* Escurece uma faixa ampla e suave atrás do texto -- sem borda
     perceptível, então não lê como "caixa". É o mesmo truque que a
     Apple usa: escurecer a própria imagem de fundo, não desenhar algo
     sobre o texto. */
  .dim{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(58% 42% at 50% 50%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 55%, rgba(0,0,0,0) 85%);
  }

  /* ---------- Hero ---------- */
  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:24px 28px 64px;
  }
  h1{
    font-family:'Outfit', sans-serif;
    font-weight:600;
    letter-spacing:-.01em;
    line-height:1.3;
    font-size:clamp(1.4rem, 4vw, 2.1rem);
    max-width:480px;
    color:#fff;
  }
  .soon{
    display:block;
    margin-top:16px;
    font-family:'Outfit', sans-serif;
    font-weight:300;
    font-size:.8rem;
    letter-spacing:.01em;
    color:var(--muted);
  }

  /* ---------- Footer ---------- */
  footer.site{
    position:relative; z-index:1;
    border-top:none; background:transparent;
    padding:0 24px 28px;
    flex-shrink:0;
  }
  footer.site .wrap{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

</style>
</head>
<body>

  <div class="dungeonBg" aria-hidden="true"></div>
  <div class="dim" aria-hidden="true"></div>

  <header class="site">
    <a class="brand" href="/">
      <img src="/play/icon-192.png" alt="">
      <span>DungeonLog</span>
    </a>
    <div class="lang">
      <a href="/" class="active">PT</a>
      <span class="sep">·</span>
      <a href="/en/">EN</a>
    </div>
  </header>

  <main>
    <h1>Sua lista de tarefas<br>vira uma masmorra.</h1>
    <span class="soon">Em breve na Google Play</span>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="mailto:arthurdungeonlog@gmail.com">Contato</a>
      <span class="dot">·</span>
      <a href="/privacy">Privacidade</a>
      <span class="dot">·</span>
      <a href="/terms">Termos</a>
    </div>
  </footer>

</body>
</html>
