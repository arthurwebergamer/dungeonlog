<!DOCTYPE html>
<!-- Landing page raiz do domínio dungeonlog.weberlabs.com.br.
     Substitui a antiga waitlist/ (removida — inclusive o Firestore de captura
     de e-mail que ela usava, ver commit). Layout inspirado na referência que
     o usuário mandou (foundable.com): logo fixo no topo, fundo full-bleed
     atmosférico, headline grande centralizada, rodapé simples -- mas SEM
     waitlist/CTA/login (não existe waitlist mais) e com fundo de masmorra
     em vez de céu noturno (pedido explícito: "céu noturno não, mas tipo usar
     algum papel de fundo bacana"). Fundo é 100% CSS (textura de pedra +
     vinheta + brilho de tocha) -- zero asset de imagem novo, zero peso extra. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DungeonLog</title>
<meta name="description" content="DungeonLog — sua lista de tarefas vira uma masmorra.">
<link rel="icon" href="/play/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  html,body{ height:100%; }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  /* Fundo "parede de masmorra": textura de pedra (blocos via linhas
     repetidas), vinheta escura nas bordas e um brilho quente de tocha
     abaixo do centro -- tudo gradientes CSS, sem nenhuma imagem. */
  .dungeonBg{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      /* brilho de tocha, atrás do texto */
      radial-gradient(60% 45% at 50% 62%, rgba(178,122,58,.16) 0%, rgba(178,122,58,0) 70%),
      /* juntas horizontais dos blocos de pedra */
      repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0px, rgba(0,0,0,.35) 2px, transparent 2px, transparent 64px),
      /* juntas verticais, alternadas (efeito "cutucado") */
      repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 2px, transparent 2px, transparent 96px),
      /* tom base da pedra, mais claro no meio, mais escuro nas bordas */
      radial-gradient(120% 90% at 50% 38%, #3c3c3c 0%, #2c2c2c 45%, #1a1a1a 100%);
    background-blend-mode:normal;
  }
  .dungeonBg::after{
    /* vinheta extra + leve ruído de granulado via gradiente diagonal */
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 70%, rgba(0,0,0,.7) 100%),
      radial-gradient(140% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  header.site{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:10px;
    padding:22px 24px;
  }
  header.site img{ width:30px; height:30px; border-radius:7px; image-rendering:pixelated; }
  header.site span{
    font-family:'Outfit', sans-serif; font-weight:800; letter-spacing:-.01em;
    font-size:1.05rem; color:var(--text);
  }

  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:40px 24px;
  }
  h1{
    font-family:'Outfit', sans-serif; font-weight:800; letter-spacing:-.02em;
    line-height:1.12;
    font-size:clamp(1.9rem, 6.4vw, 3.4rem);
    max-width:820px;
    text-shadow:0 4px 24px rgba(0,0,0,.5);
  }
  h1 .muted{ color:var(--muted); }

  footer.site{
    position:relative; z-index:1;
    border-top:none; background:transparent;
    padding:0 24px 30px;
  }
  footer.site .wrap{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>

  <div class="dungeonBg" aria-hidden="true"></div>

  <header class="site">
    <img src="/play/icon-192.png" alt="">
    <span>DungeonLog</span>
  </header>

  <main>
    <h1>Você já abandonou 5 apps de produtividade.<br class="brk">
      <span class="muted">Esse tem um monstro te encarando até você terminar.</span></h1>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="mailto:arthurdungeonlog@gmail.com">Contato</a>
      <span class="dot">·</span>
      <a href="/privacy">Privacidade</a>
      <span class="dot">·</span>
      <a href="/terms">Termos</a>
    </div>
  </footer>

</body>
</html>
