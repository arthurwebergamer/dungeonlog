<!DOCTYPE html>
<!-- Landing page raiz do domínio dungeonlog.weberlabs.com.br.
     Substitui a antiga waitlist/ (removida). Fundo = mesma fórmula que a
     .arena de combate real usa (play/style.css ~linha 1006): o tile
     TEMA_ARENA_TILE_B64 (o bloco "padrão" da Arena) + gradiente vertical
     com as cores do tema Grafite (--arena-1/2/3) + vinheta radial.

     Camada extra (pedido do usuário): "onde eu passar o dedo ou o mouse,
     o bloco destaca/acende". Implementado como uma GRADE REAL de blocos
     invisíveis (um <div> por bloco de 65x41 -- o tamanho de 1 tijolo nessa
     escala), gerada por JS pra cobrir a tela toda e se ajustar em
     qualquer resolução. Cada bloco acende com :hover no mouse (CSS puro,
     sem JS) e com toque no celular (JS: elementFromPoint no touchmove,
     já que toque não tem estado de hover). header/main/footer ficam com
     pointer-events:none (só os links do rodapé reativam) pra deixar o
     mouse/dedo "atravessar" até a grade nas áreas vazias. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DungeonLog</title>
<meta name="description" content="DungeonLog — sua lista de tarefas vira uma masmorra.">
<link rel="icon" href="/play/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  html,body{ height:100%; }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  /* ---------- Fundo: mesmo tratamento da .arena real do app ---------- */
  .dungeonBg{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.4) 100%),
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAKCAYAAADVTVykAAABfElEQVR4nJ2TwU7CQBCGvxKMQeCEXojGlMvWIw/AnfIOwh0egYfwpIneQJ4Bn4L22r10SeCoJ0CDJVkvdNPWgsT/srM738x0Z6fWZDKpPwyHdLpdlFK0222yklIyHY3o9HoHmVMUBAFvr6+49/copXBdl6KUkkW0JgxDGo0GUspfgUIInnefKKWwbTuXOUWO4/ASbZjP56ZWAeD6rILrugcD/1vwUJ5kBwsAH6sVUkqEEMbheR6e5xm7tNXYtp3LJLnkmrUBSludqmXd1mp1nQCuKpVUgN5/YJ5q1SrW3l5EGwBuzsosok1qjfW+XgPwdW6Z82K33wdg9PREr9//c8iklIwfH+kOBoRhePTpYn46HnPXagH8yl2Mjcty+eggxhJCUKtWT2Jjfrq38wa4kNz8dZv4RstofRIb84toc7CrpgPL3WcuoLVO7X3fB20Zn2VZeWHpHEd8pgPZ6QSYzWamqO/7ADSbTUrfmiAIcBzHsNm/ITn9F5ncSd8PSsnXJX9WpAwAAAAASUVORK5CYII=") repeat,
      linear-gradient(180deg, #454545 0%, #383838 55%, #2C2C2C 100%);
    background-size:auto, 130px 41px, auto;
    image-rendering:pixelated;
  }

  /* ---------- Grade de blocos interativos ---------- */
  .brickGrid{
    position:absolute; inset:0; z-index:0;
    overflow:hidden;
  }
  .brick-cell{
    position:absolute;
    box-sizing:border-box;
    background:rgba(224,160,90,0);
    box-shadow:inset 0 0 0 1px rgba(224,160,90,0);
    transition:background .5s ease, box-shadow .5s ease;
  }
  .brick-cell:hover, .brick-cell.lit{
    background:rgba(224,160,90,.22);
    box-shadow:inset 0 0 0 1px rgba(224,160,90,.55), 0 0 16px 3px rgba(224,160,90,.3);
    transition:background .08s ease-out, box-shadow .08s ease-out;
  }
  @media (prefers-reduced-motion: reduce){
    .brick-cell, .brick-cell:hover, .brick-cell.lit{ transition:none; }
  }

  /* header/main/footer deixam o ponteiro "atravessar" pras áreas vazias
     chegarem na grade -- só os links do rodapé voltam a ser clicáveis. */
  header.site, main, footer.site{ pointer-events:none; }
  footer.site a{ pointer-events:auto; }

  /* ---------- Header ---------- */
  header.site{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:10px;
    padding:24px 28px;
  }
  header.site img{ width:26px; height:26px; border-radius:6px; image-rendering:pixelated; }
  header.site span{ font-family:'Outfit',sans-serif; font-weight:600; letter-spacing:-.01em; font-size:.95rem; color:var(--text); }

  /* ---------- Hero ---------- */
  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:24px 28px 72px;
  }
  h1{
    font-family:'Outfit', sans-serif;
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.18;
    font-size:clamp(1.7rem, 4.6vw, 2.7rem);
    color:var(--text);
    max-width:640px;
  }
  p.sub{
    margin-top:14px;
    max-width:460px;
    font-family:'Outfit', sans-serif;
    font-weight:400;
    font-size:clamp(.92rem, 1.6vw, 1rem);
    color:var(--muted);
    line-height:1.6;
  }
  .soon{
    margin-top:28px;
    font-family:'Outfit', sans-serif;
    font-size:.8rem;
    letter-spacing:.02em;
    color:var(--dim);
  }

  /* ---------- Footer ---------- */
  footer.site{
    position:relative; z-index:1;
    border-top:none; background:transparent;
    padding:0 24px 30px;
  }
  footer.site .wrap{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>

  <div class="dungeonBg" aria-hidden="true"></div>
  <div class="brickGrid" id="brickGrid" aria-hidden="true"></div>

  <header class="site">
    <img src="/play/icon-192.png" alt="">
    <span>DungeonLog</span>
  </header>

  <main>
    <h1>Sua lista de tarefas vira uma masmorra.</h1>
    <p class="sub">Cada tarefa concluída vira XP. Seu personagem sobe de nível, ganha itens — e enquanto você não termina, o monstro fica ali, te encarando.</p>
    <p class="soon">Em breve na Google Play</p>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="mailto:arthurdungeonlog@gmail.com">Contato</a>
      <span class="dot">·</span>
      <a href="/privacy">Privacidade</a>
      <span class="dot">·</span>
      <a href="/terms">Termos</a>
    </div>
  </footer>

  <script>
    // Gera a grade de blocos (1 bloco = 65x41, metade do tile de 130x41
    // que o CSS já usa -- ou seja, cada <div> corresponde a 1 tijolo real
    // da parede). Recalcula no resize (debounced) pra cobrir a tela toda
    // em qualquer resolução/orientação.
    (function(){
      var host = document.getElementById('brickGrid');
      var CELL_W = 65, CELL_H = 41;
      var resizeTimer = null;

      function build(){
        host.innerHTML = '';
        var cols = Math.ceil(window.innerWidth / CELL_W) + 1;
        var rows = Math.ceil(window.innerHeight / CELL_H) + 1;
        var frag = document.createDocumentFragment();
        for (var r = 0; r < rows; r++){
          for (var c = 0; c < cols; c++){
            var cell = document.createElement('div');
            cell.className = 'brick-cell';
            cell.style.left = (c * CELL_W) + 'px';
            cell.style.top = (r * CELL_H) + 'px';
            cell.style.width = CELL_W + 'px';
            cell.style.height = CELL_H + 'px';
            frag.appendChild(cell);
          }
        }
        host.appendChild(frag);
      }

      build();
      window.addEventListener('resize', function(){
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(build, 200);
      });

      // Toque não tem :hover -- acende manualmente o bloco embaixo do dedo.
      var litCell = null;
      function litFromPoint(x, y){
        var el = document.elementFromPoint(x, y);
        if (el === litCell) return;
        if (litCell) litCell.classList.remove('lit');
        if (el && el.classList && el.classList.contains('brick-cell')){
          el.classList.add('lit');
          litCell = el;
        } else {
          litCell = null;
        }
      }
      host.addEventListener('touchstart', function(e){
        var t = e.touches[0]; if (!t) return;
        litFromPoint(t.clientX, t.clientY);
      }, {passive:true});
      host.addEventListener('touchmove', function(e){
        var t = e.touches[0]; if (!t) return;
        litFromPoint(t.clientX, t.clientY);
      }, {passive:true});
      function clearLit(){ if (litCell){ litCell.classList.remove('lit'); litCell = null; } }
      host.addEventListener('touchend', clearLit);
      host.addEventListener('touchcancel', clearLit);
    })();
  </script>

</body>
</html>
